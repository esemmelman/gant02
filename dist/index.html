<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Gant02 — a compact, shared spreadsheet Gantt planner."><title>Gant02 · Project planner</title><link rel="stylesheet" href="style.css?v=1.6.1"></head>
<body>
<header><div class="brand"><span class="logo">▰</span> Gant02 <span class="version">v1.6.1</span></div><span class="subtitle">A little structure. A clearer plan.</span><div class="header-right"><span id="sync" role="status">Connecting…</span><button id="refresh" title="Refresh from Supabase">↻</button><a href="https://github.com/esemmelman/gant02" target="_blank" rel="noopener">GitHub ↗</a></div></header>
<main>
<div class="toolbar"><div class="filters"><input id="search" type="search" placeholder="Search tasks…" aria-label="Search tasks"><select id="project-filter" aria-label="Filter project"><option value="">All projects</option></select><select id="status-filter" aria-label="Filter status"><option value="">All statuses</option><option value="assigned">Assigned</option><option value="in_progress">In progress</option><option value="done">Complete</option></select><select id="days-filter" aria-label="Filter days from today" title="Show rows with colored dates from today through the selected number of days out"><option value="all" selected>All</option><option value="1">1 Day</option><option value="3">3 Days</option><option value="7">7 Days</option><option value="30">30 Days</option></select><div id="paint-tools" class="paint-tools" role="group" aria-label="Date square colors"><button data-paint="assigned" aria-pressed="true"><i class="dot assigned"></i>Assigned</button><button data-paint="in_progress" aria-pressed="false"><i class="dot in_progress"></i>In progress</button><button data-paint="done" aria-pressed="false"><i class="dot done"></i>Complete</button><button data-paint="erase" aria-pressed="false">⌫ Clear</button></div></div><div class="timeline-controls"><button id="prev" aria-label="Previous month">‹</button><button id="today">Today</button><button id="next" aria-label="Next month">›</button><span id="range-label"></span><select id="zoom" aria-label="Timeline zoom"><option value="26">Days</option><option value="20">Compact</option><option value="40">Detailed</option></select></div></div>

<div id="error" role="alert" hidden></div>
<div class="grid-wrap" id="grid-wrap"><div id="grid" class="grid"></div></div>
<div class="bottom"><span><i class="dot assigned"></i>Assigned <i class="dot in_progress"></i>In progress <i class="dot done"></i>Complete</span><span>Click to color · Drag a colored square to move it · Drag blank squares to paint · Click a name for notes</span><span id="task-count"></span></div>
</main>
<div id="drawer-shade" hidden></div><aside id="drawer" hidden aria-label="Item details"><form id="detail-form"><div class="drawer-head"><span id="detail-type">TASK DETAILS</span><button type="button" id="close-drawer" aria-label="Close details">×</button></div><label class="name-label">Name<input id="detail-name" required maxlength="200"></label><div id="task-fields"><label>Project<select id="detail-project"></select></label><div class="field-pair"><label>Status<select id="detail-status"><option value="assigned">Assigned</option><option value="in_progress">In progress</option><option value="done">Complete</option></select></label><label>Assigned to<input id="detail-assignee" placeholder="Add a name"></label></div><div class="field-pair"><label>Start date<input type="date" id="detail-start"></label><label>End date<input type="date" id="detail-end"></label></div><button type="button" id="clear-dates" class="text-button">Clear dates</button></div><label class="notes-label">Notes</label><div class="editor-tools" role="toolbar" aria-label="Text formatting"><button type="button" data-command="bold" title="Bold"><b>B</b></button><button type="button" data-command="italic" title="Italic"><i>I</i></button><button type="button" data-command="underline" title="Underline"><u>U</u></button><button type="button" data-command="insertUnorderedList" title="Bullet list">• List</button><button type="button" data-command="insertOrderedList" title="Numbered list">1. List</button><button type="button" id="add-link" title="Insert link">↗ Link</button><button type="button" data-command="removeFormat" title="Remove formatting">Tx</button></div><div id="notes" contenteditable="true" role="textbox" aria-label="Rich text notes" aria-multiline="true" data-placeholder="Write a note, add a checklist, capture the details…"></div><div class="drawer-footer"><button type="button" id="delete-item" class="danger">Delete</button><span id="detail-message" role="status"></span></div></form></aside>
<div id="toast" role="status" hidden></div><script type="module" src="app.js?v=1.6.1"></script></body></html>
